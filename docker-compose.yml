services:
  # One-shot runner: `docker compose run --rm repotool <subcommand> ...`
  # Exists only to avoid retyping the volume/user flags on every invocation.
  repotool:
    image: repotool:latest
    build:
      context: .
      args:
        UID: "${REPOTOOL_UID:-1000}"
        GID: "${REPOTOOL_GID:-3001}"
    # Must match the owner of the dataset on the pool.
    user: "${REPOTOOL_UID:-1000}:${REPOTOOL_GID:-3001}"
    environment:
      # Passed through from the shell when set; the binary already defaults to info.
      RUST_LOG:
    volumes:
      # Host path of the archive dataset on the pool -> /data in the container.
      - "${ARCHIVE_PATH:-/mnt/red-cluster1/backup/sources}:/data"
      # Optional: SSH keys for git@ remotes.
      # - "/mnt/red-cluster1/appdata/repotool/ssh:/home/repotool/.ssh:ro"
